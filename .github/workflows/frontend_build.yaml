name: Frontend
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Clone repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
      - uses: oven-sh/setup-bun@v2
      - name: Build step
        run: |
          bun install
          bun run build
