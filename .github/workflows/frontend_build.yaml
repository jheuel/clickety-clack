name: Frontend
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Clone repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: oven-sh/setup-bun@v2
      - name: Build step
        run: |
          bun install
          bun run build
